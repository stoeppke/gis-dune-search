[project]
name = "dune-search"
version = "0.1.0"
description = "Detect inland dunes in Brandenburg by combining DGM1 slope with geological dune polygons."
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3.10",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.10",
    "requests>=2.32",
    "lxml>=5.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.scripts]
dune-search = "dune_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dune_search"]

[tool.ruff]
line-length = 100
target-version = "py311"
